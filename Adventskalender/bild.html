<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Schönes Bild</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            font-family: -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .bild-box {
            background: rgba(30, 30, 30, 0.94);
            padding: 24px 20px;
            border-radius: 20px;
            max-width: 90vw;
            width: 420px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .bild-box h2 {
            margin: 0 0 14px 0;
            font-size: 21px;
            color: #feb632;
        }

        .bild-frame {
            width: 100%;
            max-height: 55vh;
            object-fit: contain;
            border-radius: 14px;
            background: rgba(0, 0, 0, 0.35);
            display: block;
            margin: 0 auto 14px auto;
        }

        .bild-caption {
            font-size: 15px;
            line-height: 1.45;
            color: #eeeeee;
            margin: 0 0 18px 0;
        }

        .close-btn {
            background: #ffffff;
            color: #1e1e1e;
            font-size: 15px;
            padding: 11px 28px;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <div class="bild-box">
        <h2 id="bild-title">Schönes Bild</h2>
        <img id="bild-img" class="bild-frame" src="" alt="Adventsbild">
        <p id="bild-caption" class="bild-caption"></p>
        <button class="close-btn" onclick="closeOverlay()">Schließen</button>
    </div>

    <script>
        // Unterordner im Repository (mit Schrägstrich am Ende)
        const BILDER_ORDNER = 'bilder/';

        // Hier deine Bilder eintragen: { src: 'bilder/bild1.jpg', caption: '...' }
        // (Falls du nur 'bild1.jpg' schreibst, wird BILDER_ORDNER automatisch ergänzt.)
        const BILDER = [
            { src: 'bilder/bild1.jpg', caption: 'Vom 16.07.2024, hier hat Nico mir zum ersten Mal meine Haare abgeschnitten 🥳' },
            { src: 'bilder/bild2.jpg', caption: 'Nutella ist gut für die Haare hab ich gehört 🤗' },
            { src: 'bilder/bild3.jpg', caption: 'Hat Laura von mir im Wald geknipst' },
            { src: 'bilder/bild4.jpg', caption: 'Pujo-Tower mit herrlicher Aussicht' },
            { src: 'bilder/bild5.jpg', caption: 'Glaube 2014, auf der Hochzeit von meinem Bruder 😋' },
            { src: 'bilder/bild6.jpg', caption: 'Mit meiner liebsten gen Sonnenuntergang 🥰🌅' },
            { src: 'bilder/bild7.jpg', caption: 'Ich bin unendlich glücklich, dass du mich hier besucht hast und meine Leute und mein Leben hier kennen lernen konntest 💞' },
            { src: 'bilder/bild8.jpg', caption: 'Auf Azubifahrt wollten wir eine Weinwanderung machen. Ich war der einzige der für den Regen vorbereitet war, weshalb es dann doch abgesagt wurde haha' },
            { src: 'bilder/bild9.jpg', caption: '1 meiner Lieblingsbilder' },
            { src: 'bilder/bild10.jpg', caption: 'Wunderschön!' },
            { src: 'bilder/bild11.jpg', caption: '🫂' },
            { src: 'bilder/bild12.jpg', caption: 'Irgendwann 2023 mit Adriana und Simon auf Dreh, hab ich mich etwas eingesaut beim Mittagessen 🐷' },
            { src: 'bilder/bild13.jpg', caption: 'Auf den Treppen zum Pujo-Berg' },
            { src: 'bilder/bild14.jpg', caption: 'Frischer Iro und frische Farbe' },
            { src: 'bilder/bild15.jpg', caption: 'Colormatched' },
            { src: 'bilder/bild16.jpg', caption: 'Olaf-Abi und ich' },
            { src: 'bilder/bild17.jpg', caption: 'Auf der Suche nach dem perfekten Winkel um meinen Abschlussfilm zu drehen, kam auch der Schuss aus Davids Kühlschrank in Frage 📹' },
            { src: 'bilder/bild18.jpg'},
            { src: 'bilder/bild19.jpg', caption: 'Ready to work bei Take That' },
            { src: 'bilder/bild20.jpg', caption: 'Meine liebste Einmummel-Hummel 🐝' },
            { src: 'bilder/bild21.jpg', caption: 'Eine kleine Echse zu Besuch auf meinem Schuh auf Madeira' },
            { src: 'bilder/bild22.jpg', caption: 'Sonnenaufgang aufm Pico do Areeiro' },
            { src: 'bilder/bild23.jpg', caption: '😻' }
        ];

        const USED_STORAGE_KEY = 'lotti_advent_used_bilder_v1';
        const DOOR_MAP_STORAGE_KEY = 'lotti_advent_door_bilder_v1';
        const LAST_FRESH_STORAGE_KEY = 'lotti_advent_last_fresh_bild_v1';

        const params = new URLSearchParams(window.location.search);
        const doorKey = params.get('door') || 'default';
        const isFresh = params.has('fresh');

        if (params.get('door')) {
            document.getElementById('bild-title').innerText =
                String(doorKey).startsWith('Test') ? 'Bild – ' + doorKey + '-Türchen' : 'Bild – Türchen ' + doorKey;
        }

        function resolveBildSrc(rawSrc) {
            if (!rawSrc) return '';
            const trimmed = String(rawSrc).trim();
            if (/^(https?:\/\/|data:|\/)/i.test(trimmed)) return trimmed;
            if (BILDER_ORDNER && !trimmed.startsWith(BILDER_ORDNER)) {
                return BILDER_ORDNER.replace(/\/?$/, '/') + trimmed.replace(/^\/+/, '');
            }
            return trimmed;
        }

        function loadUsedIndices() {
            try {
                const raw = localStorage.getItem(USED_STORAGE_KEY);
                if (!raw) return [];
                const parsed = JSON.parse(raw);
                if (!Array.isArray(parsed)) return [];
                return parsed.filter(idx => Number.isInteger(idx) && idx >= 0 && idx < BILDER.length);
            } catch (e) {
                return [];
            }
        }

        function saveUsedIndices(indices) {
            try {
                localStorage.setItem(USED_STORAGE_KEY, JSON.stringify(indices));
            } catch (e) {}
        }

        function loadDoorMap() {
            try {
                const raw = localStorage.getItem(DOOR_MAP_STORAGE_KEY);
                if (!raw) return {};
                const parsed = JSON.parse(raw);
                return (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) ? parsed : {};
            } catch (e) {
                return {};
            }
        }

        function saveDoorMap(map) {
            try {
                localStorage.setItem(DOOR_MAP_STORAGE_KEY, JSON.stringify(map));
            } catch (e) {}
        }

        function getLastFreshIndex() {
            try {
                const raw = sessionStorage.getItem(LAST_FRESH_STORAGE_KEY);
                const num = Number(raw);
                return Number.isInteger(num) ? num : -1;
            } catch (e) {
                return -1;
            }
        }

        function setLastFreshIndex(idx) {
            try {
                sessionStorage.setItem(LAST_FRESH_STORAGE_KEY, String(idx));
            } catch (e) {}
        }

        function pickNextIndex(used, avoidIndex) {
            let currentUsed = Array.isArray(used) ? [...used] : [];
            if (currentUsed.length >= BILDER.length) {
                currentUsed = [];
            }

            let candidates = [];
            for (let i = 0; i < BILDER.length; i++) {
                if (!currentUsed.includes(i)) {
                    candidates.push(i);
                }
            }

            if (candidates.length > 1 && avoidIndex >= 0) {
                const withoutLast = candidates.filter(i => i !== avoidIndex);
                if (withoutLast.length > 0) {
                    candidates = withoutLast;
                }
            }

            const chosenIndex = candidates[Math.floor(Math.random() * candidates.length)];
            currentUsed.push(chosenIndex);
            saveUsedIndices(currentUsed);
            return chosenIndex;
        }

        function getBildForDoor(door, freshMode) {
            if (!BILDER.length) {
                return { src: '', caption: 'Noch keine Bilder in BILDER hinterlegt.' };
            }

            const used = loadUsedIndices();

            if (freshMode) {
                const lastFresh = getLastFreshIndex();
                const chosenIndex = pickNextIndex(used, lastFresh);
                setLastFreshIndex(chosenIndex);
                return BILDER[chosenIndex];
            }

            const doorMap = loadDoorMap();
            if (Object.prototype.hasOwnProperty.call(doorMap, door)) {
                const savedIndex = doorMap[door];
                if (Number.isInteger(savedIndex) && savedIndex >= 0 && savedIndex < BILDER.length) {
                    return BILDER[savedIndex];
                }
            }

            const chosenIndex = pickNextIndex(used, -1);
            doorMap[door] = chosenIndex;
            saveDoorMap(doorMap);

            return BILDER[chosenIndex];
        }

        function closeOverlay() {
            const videoEl = document.querySelector('video');
            if (videoEl) videoEl.pause();

            if (window.parent && typeof window.parent.closeContentOverlay === 'function') {
                window.parent.closeContentOverlay();
            } else if (window.parent && typeof window.parent.closeSudokuOverlay === 'function') {
                window.parent.closeSudokuOverlay();
            }
        }

        const item = getBildForDoor(doorKey, isFresh);
        const imgEl = document.getElementById('bild-img');
        const resolvedSrc = resolveBildSrc(item.src);
        if (resolvedSrc) {
            imgEl.src = resolvedSrc;
        } else {
            imgEl.style.display = 'none';
        }
        document.getElementById('bild-caption').innerText = item.caption || '';
    </script>
</body>
</html>
