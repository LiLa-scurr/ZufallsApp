<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Spruch des Tages</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            font-family: -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .spruch-box {
            background: rgba(30, 30, 30, 0.92);
            padding: 28px 22px;
            border-radius: 20px;
            max-width: 88vw;
            width: 380px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .spruch-box h2 {
            margin: 0 0 14px 0;
            font-size: 22px;
            color: #feb632;
        }

        .spruch-text {
            font-size: 18px;
            line-height: 1.55;
            color: #f8f9fa;
            margin: 0 0 18px 0;
            font-style: italic;
        }

        .button-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .play-btn {
            background: #feb632;
            color: #1e1e1e;
            font-size: 15px;
            padding: 11px 26px;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(254, 182, 50, 0.25);
        }

        .play-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .spruch-btn {
            background: #ffffff;
            color: #1e1e1e;
            font-size: 15px;
            padding: 11px 26px;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
        }
    </style>
</head>

<body>

    <div class="spruch-box">

        <h2 id="spruch-title">Spruch</h2>

        <p id="spruch-text" class="spruch-text"></p>

        <div class="button-row">

            <button
                type="button"
                id="play-audio-btn"
                class="play-btn"
                onclick="toggleSpruchAudio()">
                ▶ Abspielen
            </button>

            <button
                type="button"
                class="spruch-btn"
                onclick="closeOverlay()">
                Schließen
            </button>

        </div>
    </div>

    <audio id="spruch-audio" preload="auto" playsinline style="display:none;"></audio>


    <script>

        // =====================================================
        // EINSTELLUNGEN
        // =====================================================

        // Unterordner für deine Sprachaufnahmen
        const SPRUECHE_AUDIO_ORDNER = 'sprueche/';


        // =====================================================
        // SPRÜCHE UND AUDIO-DATEIEN
        // =====================================================

        const SPRUECHE = [

            { text: "Eine Oma muss man schlagen.", audio: "deleteme.mp3" },

            /*
            { text: "Wer anderen eine Grube gräbt, der hat ein Gruben-Grab-Gerät.", audio: "spruch2.mp3" },
            { text: "Wer anderen eine Bratwurst brät, der hat ein Bratwurst-Brat-Gerät.", audio: "spruch3.mp3" },
            { text: "Morgenstund hat Blei im Arsch.", audio: "spruch4.mp3" },
            { text: "Wer das liest ist eine Maus.", audio: "spruch5.mp3" },
            { text: "Hah! Ich bin der Zauberer!", audio: "spruch6.mp3" },
            { text: "Määähh! Ich möchte, Trauben!", audio: "spruch7.mp3" },
            { text: "Uhhhh, ich bin der Geist!", audio: "spruch8.mp3" },
            { text: "Da hat doch jemand die Ritterrüstung umgeschmissen! Ich geh bis in deinen Raum!", audio: "spruch9.mp3" },
            { text: "Ohjeee! Miau, der Rabe hat die Kirschen gestohlen!", audio: "spruch10.mp3" },
            { text: "Gib mir, meine Mausi!", audio: "spruch11.mp3" },
            { text: "Auf dem Hintergrund Bild siehst du mich, wie ich durchs verschneite Finnland wandere und meine liebste Lotti suche.", audio: "spruch12.mp3" },
            { text: "Habiiiiibpb!", audio: "spruch13.mp3" },
            { text: "Wallah billah schwöre sogar Digga. Noch son Ding, Penisring.", audio: "spruch14.mp3" },
            { text: "Gude Guido, geiler Garten!", audio: "spruch15.mp3" },
            { text: "Liebe Lotti, lässige Lamas liegen lustigerweise lebenslang!", audio: "spruch16.mp3" },
            */

            { text: "Lasagne lässt Linsensuppe locker links liegen.", audio: "spruch17.mp3" }

        ];


        // =====================================================
        // SPEICHERUNG UND TÜRCHEN
        // =====================================================

        const USED_STORAGE_KEY = 'lotti_advent_used_sprueche_v1';
        const DOOR_MAP_STORAGE_KEY = 'lotti_advent_door_sprueche_v1';
        const LAST_FRESH_STORAGE_KEY = 'lotti_advent_last_fresh_spruch_v1';

        const params = new URLSearchParams(window.location.search);
        const doorKey = params.get('door') || 'default';
        const isFresh = params.has('fresh');

        const spruchAudioEl = document.getElementById('spruch-audio');
        const playButton = document.getElementById('play-audio-btn');


        // =====================================================
        // AUDIO-VERSTÄRKUNG
        // =====================================================

        let audioContext = null;
        let audioSourceNode = null;
        let audioGainNode = null;
        let audioCompressorNode = null;

        let audioBoostActive = false;


        // Hier kannst du die Verstärkung einstellen.
        // 1.0 = normale Lautstärke
        // 2.0 = stärkere Verstärkung
        // 5.0 = sehr starke Verstärkung

        const AUDIO_GAIN = 5.0;


        async function activateAudioBoost() {

            const AudioContextClass =
                window.AudioContext || window.webkitAudioContext;

            if (!AudioContextClass) {
                console.warn('Web Audio API wird nicht unterstützt.');
                return false;
            }

            try {

                // Audio-System nur einmal erstellen
                if (!audioContext) {

                    audioContext = new AudioContextClass();

                    audioSourceNode =
                        audioContext.createMediaElementSource(spruchAudioEl);

                    audioGainNode = audioContext.createGain();

                    audioCompressorNode =
                        audioContext.createDynamicsCompressor();


                    // Lautstärke verstärken
                    audioGainNode.gain.value = AUDIO_GAIN;


                    // Dynamik-Kompressor
                    audioCompressorNode.threshold.value = -6;
                    audioCompressorNode.knee.value = 0;
                    audioCompressorNode.ratio.value = 12;
                    audioCompressorNode.attack.value = 0.003;
                    audioCompressorNode.release.value = 0.25;


                    // Audio-Verarbeitung verbinden
                    audioSourceNode.connect(audioGainNode);

                    audioGainNode.connect(audioCompressorNode);

                    audioCompressorNode.connect(audioContext.destination);

                }


                // AudioContext aktivieren
                if (audioContext.state !== 'running') {

                    await audioContext.resume();

                }


                const isActive = audioContext.state === 'running';

                console.log(
                    'Audio-Verstärkung:',
                    isActive ? AUDIO_GAIN + 'x aktiviert' : 'nicht aktiv'
                );

                return isActive;


            } catch (e) {

                console.error('Audio-Verstärkung fehlgeschlagen:', e);

                return false;

            }

        }


        // =====================================================
        // STATUS
        // =====================================================

        let isClosingOverlay = false;
        let hasFinishedOnce = false;


        if (params.get('door')) {

            document.getElementById('spruch-title').innerText =
                String(doorKey).startsWith('Test')
                    ? 'Spruch – ' + doorKey + '-Türchen'
                    : 'Spruch – Türchen ' + doorKey;

        }


        // =====================================================
        // HINTERGRUNDMUSIK STEUERN
        // =====================================================

        function setParentMusicDucking(ducked) {

            if (window.parent && typeof window.parent.setVideoMusicDucking === 'function') {

                window.parent.setVideoMusicDucking(ducked);

            } else if (window.parent && typeof window.parent.setVideoMusicFade === 'function') {

                window.parent.setVideoMusicFade(ducked);

            }

        }


        // =====================================================
        // AUDIO-PFAD ERMITTELN
        // =====================================================

        function resolveAudioSrc(rawAudio) {

            if (!rawAudio) return '';

            const trimmed = String(rawAudio).trim();

            if (!trimmed) return '';

            if (/^(https?:\/\/|data:|\/)/i.test(trimmed)) {
                return trimmed;
            }

            if (
                SPRUECHE_AUDIO_ORDNER &&
                !trimmed.startsWith(SPRUECHE_AUDIO_ORDNER)
            ) {

                return SPRUECHE_AUDIO_ORDNER.replace(/\/?$/, '/') +
                    trimmed.replace(/^\/+/, '');

            }

            return trimmed;

        }


        // =====================================================
        // AUDIO VORBEREITEN
        // =====================================================

        function prepareSpruchAudio(rawAudio) {

            const src = resolveAudioSrc(rawAudio);

            if (!src || !spruchAudioEl) {

                playButton.disabled = true;
                playButton.innerText = 'Keine Audio vorhanden';

                return;

            }

            isClosingOverlay = false;
            hasFinishedOnce = false;
            audioBoostActive = false;

            spruchAudioEl.loop = false;


            // Audio startet
            spruchAudioEl.onplay = () => {

                if (!isClosingOverlay) {

                    playButton.innerText = audioBoostActive
                        ? '⏸ Pause (verstärkt)'
                        : '⏸ Pause (normal)';

                    setParentMusicDucking(true);

                }

            };


            // Audio pausiert
            spruchAudioEl.onpause = () => {

                if (!isClosingOverlay && !hasFinishedOnce) {

                    playButton.innerText = '▶ Weiter';

                    setParentMusicDucking(false);

                }

            };


            // Audio beendet
            spruchAudioEl.onended = () => {

                hasFinishedOnce = true;

                playButton.innerText = '↻ Erneut abspielen';

                setParentMusicDucking(false);

            };


            // Fehler bei der Audiodatei
            spruchAudioEl.onerror = () => {

                playButton.disabled = true;

                playButton.innerText = 'Audio nicht verfügbar';

                setParentMusicDucking(false);

            };


            spruchAudioEl.src = src;

            spruchAudioEl.load();

            playButton.disabled = false;

            playButton.innerText = '▶ Abspielen';

        }


        // =====================================================
        // PLAY / PAUSE / ERNEUT ABSPIELEN
        // =====================================================

        async function toggleSpruchAudio() {

            if (
                isClosingOverlay ||
                !spruchAudioEl ||
                !spruchAudioEl.src
            ) {

                return;

            }


            // Wenn Audio läuft: pausieren
            if (!spruchAudioEl.paused) {

                spruchAudioEl.pause();

                return;

            }


            // Wenn Audio bereits beendet wurde:
            // wieder von vorne beginnen
            if (hasFinishedOnce || spruchAudioEl.ended) {

                spruchAudioEl.currentTime = 0;

                hasFinishedOnce = false;

            }


            try {

                // Beide Aktionen direkt beim Klick starten,
                // damit die Browser-Freigabe erhalten bleibt.

                const boostPromise = activateAudioBoost();

                const playPromise = spruchAudioEl.play();


                // Wiedergabe starten
                await playPromise;


                // Warten, bis die Verstärkung aktiviert wurde
                audioBoostActive = await boostPromise;


                // Button aktualisieren
                if (!spruchAudioEl.paused) {

                    playButton.innerText = audioBoostActive
                        ? '⏸ Pause (verstärkt)'
                        : '⏸ Pause (normal)';

                }


                if (!audioBoostActive) {

                    console.warn(
                        'Audio läuft ohne zusätzliche Verstärkung.'
                    );

                }


            } catch (e) {

                console.error('Audio-Wiedergabe fehlgeschlagen:', e);

                audioBoostActive = false;

                setParentMusicDucking(false);

                playButton.innerText = '▶ Erneut versuchen';

            }

        }


        // =====================================================
        // AUDIO BEIM SCHLIESSEN STOPPEN
        // =====================================================

        function stopSpruchAudio() {

            isClosingOverlay = true;

            audioBoostActive = false;

            if (spruchAudioEl) {

                try {

                    spruchAudioEl.pause();

                    spruchAudioEl.currentTime = 0;

                    spruchAudioEl.removeAttribute('src');

                    spruchAudioEl.load();

                } catch (e) {}

            }

            setParentMusicDucking(false);

        }


        // =====================================================
        // VERWENDETE SPRÜCHE LADEN
        // =====================================================

        function loadUsedIndices() {

            try {

                const raw = localStorage.getItem(USED_STORAGE_KEY);

                if (!raw) return [];

                const parsed = JSON.parse(raw);

                if (!Array.isArray(parsed)) return [];

                return parsed.filter(idx =>
                    Number.isInteger(idx) &&
                    idx >= 0 &&
                    idx < SPRUECHE.length
                );

            } catch (e) {

                return [];

            }

        }


        function saveUsedIndices(indices) {

            try {

                localStorage.setItem(
                    USED_STORAGE_KEY,
                    JSON.stringify(indices)
                );

            } catch (e) {}

        }


        // =====================================================
        // TÜRCHEN-ZUORDNUNG LADEN
        // =====================================================

        function loadDoorMap() {

            try {

                const raw = localStorage.getItem(DOOR_MAP_STORAGE_KEY);

                if (!raw) return {};

                const parsed = JSON.parse(raw);

                return (
                    parsed &&
                    typeof parsed === 'object' &&
                    !Array.isArray(parsed)
                ) ? parsed : {};

            } catch (e) {

                return {};

            }

        }


        function saveDoorMap(map) {

            try {

                localStorage.setItem(
                    DOOR_MAP_STORAGE_KEY,
                    JSON.stringify(map)
                );

            } catch (e) {}

        }


        // =====================================================
        // LETZTEN FRESH-SPRUCH LADEN
        // =====================================================

        function getLastFreshIndex() {

            try {

                const raw = sessionStorage.getItem(LAST_FRESH_STORAGE_KEY);

                const num = Number(raw);

                return Number.isInteger(num) ? num : -1;

            } catch (e) {

                return -1;

            }

        }


        function setLastFreshIndex(idx) {

            try {

                sessionStorage.setItem(
                    LAST_FRESH_STORAGE_KEY,
                    String(idx)
                );

            } catch (e) {}

        }


        // =====================================================
        // NÄCHSTEN SPRUCH AUSWÄHLEN
        // =====================================================

        function pickNextIndex(used, avoidIndex) {

            let currentUsed = Array.isArray(used) ? [...used] : [];


            if (currentUsed.length >= SPRUECHE.length) {

                currentUsed = [];

            }


            let candidates = [];

            for (let i = 0; i < SPRUECHE.length; i++) {

                if (!currentUsed.includes(i)) {

                    candidates.push(i);

                }

            }


            if (candidates.length > 1 && avoidIndex >= 0) {

                const withoutLast = candidates.filter(
                    i => i !== avoidIndex
                );

                if (withoutLast.length > 0) {

                    candidates = withoutLast;

                }

            }


            const chosenIndex = candidates[
                Math.floor(Math.random() * candidates.length)
            ];


            currentUsed.push(chosenIndex);

            saveUsedIndices(currentUsed);

            return chosenIndex;

        }


        // =====================================================
        // SPRUCHDATEN VEREINHEITLICHEN
        // =====================================================

        function normalizeSpruchEntry(entry) {

            if (typeof entry === 'string') {

                return {
                    text: entry,
                    audio: ''
                };

            }


            if (entry && typeof entry === 'object') {

                return {
                    text: entry.text || '',
                    audio: entry.audio || ''
                };

            }


            return {
                text: '',
                audio: ''
            };

        }


        // =====================================================
        // SPRUCH FÜR DAS TÜRCHEN ERMITTELN
        // =====================================================

        function getSpruchForDoor(door, freshMode) {

            if (SPRUECHE.length === 0) {

                return {
                    text: "Keine Sprüche hinterlegt.",
                    audio: ""
                };

            }


            const used = loadUsedIndices();


            if (freshMode) {

                const lastFresh = getLastFreshIndex();

                const chosenIndex = pickNextIndex(
                    used,
                    lastFresh
                );

                setLastFreshIndex(chosenIndex);

                return normalizeSpruchEntry(
                    SPRUECHE[chosenIndex]
                );

            }


            const doorMap = loadDoorMap();


            if (Object.prototype.hasOwnProperty.call(doorMap, door)) {

                const savedIndex = doorMap[door];

                if (
                    Number.isInteger(savedIndex) &&
                    savedIndex >= 0 &&
                    savedIndex < SPRUECHE.length
                ) {

                    return normalizeSpruchEntry(
                        SPRUECHE[savedIndex]
                    );

                }

            }


            const chosenIndex = pickNextIndex(used, -1);

            doorMap[door] = chosenIndex;

            saveDoorMap(doorMap);

            return normalizeSpruchEntry(
                SPRUECHE[chosenIndex]
            );

        }


        // =====================================================
        // OVERLAY SCHLIESSEN
        // =====================================================

        function closeOverlay() {

            stopSpruchAudio();

            if (
                window.parent &&
                typeof window.parent.closeContentOverlay === 'function'
            ) {

                window.parent.closeContentOverlay();

            } else if (
                window.parent &&
                typeof window.parent.closeSudokuOverlay === 'function'
            ) {

                window.parent.closeSudokuOverlay();

            }

        }


        // =====================================================
        // AUDIO BEIM VERLASSEN DER SEITE STOPPEN
        // =====================================================

        window.addEventListener('pagehide', stopSpruchAudio);

        window.addEventListener('beforeunload', stopSpruchAudio);


        // =====================================================
        // AKTUELLEN SPRUCH LADEN
        // =====================================================

        const activeSpruch = getSpruchForDoor(
            doorKey,
            isFresh
        );


        document.getElementById('spruch-text').innerText =
            '„' + activeSpruch.text + '“';


        // Audio nur vorbereiten.
        // Sie startet erst beim Klick auf den Play-Button.

        prepareSpruchAudio(activeSpruch.audio);


    </script>

</body>
</html>
