<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Spruch des Tages</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            font-family: -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .spruch-box {
            background: rgba(30, 30, 30, 0.92);
            padding: 28px 22px;
            border-radius: 20px;
            max-width: 88vw;
            width: 380px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .spruch-box h2 {
            margin: 0 0 14px 0;
            font-size: 22px;
            color: #feb632;
        }

        .spruch-text {
            font-size: 18px;
            line-height: 1.55;
            color: #f8f9fa;
            margin: 0 0 18px 0;
            font-style: italic;
        }

        .spruch-btn {
            background: #ffffff;
            color: #1e1e1e;
            font-size: 15px;
            padding: 11px 26px;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <div class="spruch-box">
        <h2 id="spruch-title">Spruch</h2>
        <p id="spruch-text" class="spruch-text"></p>
        <button class="spruch-btn" onclick="closeOverlay()">Schließen</button>
    </div>

    <script>
        // Hier deine 20 Sprüche eintragen (Index 0 bis 19)
        const SPRUECHE = [
            "Eine Oma muss man schlagen.",
            "Wer anderen eine Grube gräbt, der hat ein Gruben-Grab-Gerät.",
            "Wer anderen eine Bratwurst brät, der hat ein Bratwurst-Brat-Gerät.",
            "Morgenstund hat Blei im Arsch.",
            "Wer das liest ist eine Maus.",
            "Hah! Ich bin der Zauberer!",
            "Määähh! Ich möchte, Trauben!",
            "Uhhhh, ich bin der Geist!",
            "Da hat doch jemand die Ritterrüstung umgeschmissen! Ich geh bis in deinen Raum!",
            "Ohjeee! Miau, der Rabe hat die Kirschen gestohlen!",
            "Gib mir, meine Mausi!",
            "Auf dem Hintergrund Bild siehst du mich, wie ich durchs verschneite Finnland wandere und meine liebste Lotti suche.",
            "Habiiiiibpb!",
            "Wallah billah schwöre sogar Digga. Noch son Ding, Penisring.",
            "Gude Guido, geiler Garten!",
            "Liebe Lotti, lässige Lamas liegen lustigerweise lebenslang!",
            "Lasagne lässt Linsensuppe locker links liegen."
        ];

        const USED_STORAGE_KEY = 'lotti_advent_used_sprueche_v1';
        const DOOR_MAP_STORAGE_KEY = 'lotti_advent_door_sprueche_v1';

        const params = new URLSearchParams(window.location.search);
        const doorKey = params.get('door') || 'default';

        if (params.get('door')) {
            document.getElementById('spruch-title').innerText =
                doorKey === 'Test' ? 'Spruch – Test-Türchen' : 'Spruch – Türchen ' + doorKey;
        }

        function loadUsedIndices() {
            try {
                const raw = localStorage.getItem(USED_STORAGE_KEY);
                if (!raw) return [];
                const parsed = JSON.parse(raw);
                if (!Array.isArray(parsed)) return [];
                return parsed.filter(idx => Number.isInteger(idx) && idx >= 0 && idx < SPRUECHE.length);
            } catch (e) {
                return [];
            }
        }

        function saveUsedIndices(indices) {
            try {
                localStorage.setItem(USED_STORAGE_KEY, JSON.stringify(indices));
            } catch (e) {}
        }

        function loadDoorMap() {
            try {
                const raw = localStorage.getItem(DOOR_MAP_STORAGE_KEY);
                if (!raw) return {};
                const parsed = JSON.parse(raw);
                return (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) ? parsed : {};
            } catch (e) {
                return {};
            }
        }

        function saveDoorMap(map) {
            try {
                localStorage.setItem(DOOR_MAP_STORAGE_KEY, JSON.stringify(map));
            } catch (e) {}
        }

        function getSpruchForDoor(door) {
            if (SPRUECHE.length === 0) {
                return "Keine Sprüche hinterlegt.";
            }

            const doorMap = loadDoorMap();

            // Wenn dieses Türchen schon einen gespeicherten Spruch hat, genau diesen wieder zeigen
            if (Object.prototype.hasOwnProperty.call(doorMap, door)) {
                const savedIndex = doorMap[door];
                if (Number.isInteger(savedIndex) && savedIndex >= 0 && savedIndex < SPRUECHE.length) {
                    return SPRUECHE[savedIndex];
                }
            }

            // Sonst einen noch nicht verwendeten Spruch zufällig ziehen
            let used = loadUsedIndices();
            if (used.length >= SPRUECHE.length) {
                used = [];
            }

            const remaining = [];
            for (let i = 0; i < SPRUECHE.length; i++) {
                if (!used.includes(i)) {
                    remaining.push(i);
                }
            }

            const chosenIndex = remaining[Math.floor(Math.random() * remaining.length)];
            used.push(chosenIndex);
            saveUsedIndices(used);

            doorMap[door] = chosenIndex;
            saveDoorMap(doorMap);

            return SPRUECHE[chosenIndex];
        }

        function closeOverlay() {
            if (window.parent && typeof window.parent.closeContentOverlay === 'function') {
                window.parent.closeContentOverlay();
            } else if (window.parent && typeof window.parent.closeSudokuOverlay === 'function') {
                window.parent.closeSudokuOverlay();
            }
        }

        document.getElementById('spruch-text').innerText = '„' + getSpruchForDoor(doorKey) + '“';
    </script>
</body>
</html>
