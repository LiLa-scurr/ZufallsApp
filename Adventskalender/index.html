<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">

    <link rel="apple-touch-icon" href="icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>Adventskalender für Lotti</title>
    <style>
        /* Basis-Styling */
        body {
            margin: 0;
            width: 100vw;
            height: 100vh;
            background: #111;
            font-family: -apple-system, sans-serif;
            overflow: hidden;
            perspective: 2000px;
        }

        /* REIN WEISSER SCHNEE */
        .snow-container {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 10;
            perspective: 1000px;
        }

        .snow-particle {
            position: absolute;
            user-select: none;
            pointer-events: none;
            will-change: transform;
            transition: transform 0.1s linear;
            color: #ffffff !important;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.8);
        }

        /* POP-UP MODAL FÜR TÜRCHEN */
        .popup-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .popup-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .popup-content {
            background: rgba(30, 30, 30, 0.9);
            padding: 30px 25px;
            border-radius: 20px;
            max-width: 80%;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            transform: translateY(30px) scale(0.9);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
        }

        .popup-overlay.visible .popup-content { transform: translateY(0) scale(1); }

        .popup-content h2 {
            margin-top: 0;
            font-size: 22px;
            color: #feb632;
            margin-bottom: 15px;
        }

        .popup-content p {
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 15px;
            color: #eeeeee;
        }

        .popup-content button {
            background: #ffffff;
            color: #1e1e1e;
            font-size: 16px;
            padding: 12px 30px;
            margin-top: 5px;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255,255,255,0.2);
        }

        .option-btn {
            display: block;
            width: 100%;
            margin: 10px 0;
            background: #2c3e50 !important;
            color: white !important;
            border: 1px solid #34495e !important;
        }

        /* SUDOKU POP-UP */
        .sudoku-modal-content {
            max-width: 92vw;
            width: 390px;
            padding: 22px 18px;
        }

        .sudoku-sub {
            font-size: 13px !important;
            color: #cccccc !important;
            margin-bottom: 12px !important;
        }

        .sudoku-board {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 3px;
            background: #556b82;
            padding: 4px;
            border-radius: 12px;
            margin: 0 auto 14px auto;
            max-width: 330px;
        }

        .sudoku-cell {
            width: 100%;
            aspect-ratio: 1 / 1;
            border: none;
            border-radius: 6px;
            background: #1f2933;
            color: #ffffff;
            font-size: 20px;
            font-weight: 800;
            text-align: center;
            padding: 0;
            box-sizing: border-box;
            outline: none;
            caret-color: #feb632;
            transition: background 0.15s ease, color 0.15s ease, transform 0.1s ease;
        }

        .sudoku-cell.given {
            background: #2e3b4e;
            color: #f8f9fa;
            cursor: pointer;
        }

        .sudoku-cell:not(.given) {
            color: #7dd3fc;
        }

        /* 2x3 Block-Abgrenzung */
        .sudoku-cell.block-right {
            margin-right: 4px;
        }

        .sudoku-cell.block-bottom {
            margin-bottom: 4px;
        }

        .sudoku-cell.selected {
            box-shadow: inset 0 0 0 2px #feb632;
            background: #334155;
        }

        .sudoku-cell.highlighted {
            background: #feb632 !important;
            color: #111827 !important;
        }

        .sudoku-cell.conflict {
            background: #991b1b !important;
            color: #fecaca !important;
        }

        .sudoku-status {
            min-height: 22px;
            font-size: 14px !important;
            font-weight: 600;
            color: #feb632 !important;
            margin-bottom: 10px !important;
        }

        .sudoku-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .sudoku-actions button {
            padding: 10px 18px;
            font-size: 14px;
            margin-top: 0;
        }

        /* SCROLLBEREICH */
        .advent-scroll-container {
            width: 100vw;
            height: 100vh;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
            position: relative;
        }

        /* KANVAS MIT EXAKTEM BILD-SEITENVERHÄLTNIS (KEINE SCHWARZEN BALKEN, KEIN STAUCHEN) */
        .advent-canvas {
            width: 240vw;
            height: calc(240vw * 768 / 1376);
            background-image: url('advent-bg.jpg');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
            position: relative;
        }

        /* Auf dem Handy stärker herangezoomt starten und nur über das Bild scrollen */
        @media screen and (max-width: 768px) {
            .advent-canvas {
                width: 700vw;
                height: calc(700vw * 768 / 1376);
            }
        }

        /* SCHNEEFLOCKEN-EMOJI TÜRNCHEN */
        .advent-door {
            position: absolute;
            width: 80px;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.2s ease, filter 0.2s ease;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.6));
        }

        .advent-door::before {
            content: '❄️';
            font-size: 78px;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.9));
        }

        .advent-door-number {
            position: relative;
            z-index: 2;
            font-size: 22px;
            font-weight: 900;
            color: #0d47a1;
            text-shadow: 0 0 6px #ffffff, 0 0 3px #ffffff, 0 1px 2px rgba(0,0,0,0.8);
        }

        .advent-door:active {
            transform: scale(0.85) rotate(15deg);
        }

        /* ZURÜCK-BUTTON */
        .btn-back {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            padding: 12px 25px;
            font-size: 15px;
            border-radius: 30px;
            border: 1px solid #b2ebf2;
            background: rgba(30, 40, 55, 0.85);
            color: white;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <!-- SCHNEE CONTAINER -->
    <div id="snow-container" class="snow-container"></div>

    <!-- AUDIO -->
    <audio id="advent-audio" src="advent-music.mp3" loop autoplay playsinline></audio>

    <!-- POPUP -->
    <div id="door-options-modal" class="popup-overlay">
        <div class="popup-content">
            <h2 id="door-modal-title">Türchen</h2>
            <p>Was möchtest du heute entdecken?</p>
            <button class="option-btn" onclick="openDoorContent('spruch')">💬 Ein Spruch</button>
            <button class="option-btn" onclick="openDoorContent('bild')">🖼️ Ein Bild</button>
            <button class="option-btn" onclick="openDoorContent('sudoku')">🧩 Ein Sudoku</button>
            <button class="option-btn" onclick="openDoorContent('video')">🎬 Ein Video</button>
            <button onclick="closeDoorModal()" style="background: #545456; color: white; margin-top: 15px;">Abbrechen</button>
        </div>
    </div>

    <!-- POPUP FÜR NOCH VERSCHLOSSENE TÜRCHEN -->
    <div id="door-locked-modal" class="popup-overlay">
        <div class="popup-content">
            <h2 id="door-locked-title">Türchen noch verschlossen</h2>
            <p>Na neugierig? Leider musst du dich noch etwas gedulden Mausi &lt;3<br>Komm später wieder!</p>
            <button onclick="closeLockedModal()">Okay</button>
        </div>
    </div>

    <!-- SUDOKU POP-UP -->
    <div id="sudoku-modal" class="popup-overlay">
        <div class="popup-content sudoku-modal-content">
            <h2 id="sudoku-modal-title">Sudoku</h2>
            <p class="sudoku-sub">Zahlen 1–6 in jede Zeile, Spalte &amp; jeden 2×3-Block. Klicke auf eine Zahl zum Hervorheben.</p>
            <div id="sudoku-board" class="sudoku-board"></div>
            <p id="sudoku-status" class="sudoku-status"></p>
            <div class="sudoku-actions">
                <button onclick="resetCurrentSudoku()" style="background: #334155; color: white;">Neu starten</button>
                <button onclick="closeSudokuModal()">Schließen</button>
            </div>
        </div>
    </div>

    <!-- KANVAS CONTAINER -->
    <div id="advent-scroll-container" class="advent-scroll-container">
        <div id="advent-canvas" class="advent-canvas">
            <!-- Türchen werden via JS platziert -->
        </div>
    </div>
    <button class="btn-back" onclick="window.location.href='menu.html'">⬅ Zurück zum Menü</button>

<script>
    let selectedDoorNumber = null;

    let snowParticles = [];
    let snowAnimFrame = null;
    let lastScrollX = 0;
    let lastScrollY = 0;
    let scrollVelocityX = 0;
    let scrollVelocityY = 0;

    // Basis-6x6-Sudoku-Lösungen (2 Zeilen x 3 Spalten pro Block)
    const baseSudokuSolutions = [
        [
            [1, 2, 3, 4, 5, 6],
            [4, 5, 6, 1, 2, 3],
            [2, 3, 1, 5, 6, 4],
            [5, 6, 4, 2, 3, 1],
            [3, 1, 2, 6, 4, 5],
            [6, 4, 5, 3, 1, 2]
        ],
        [
            [2, 4, 6, 1, 3, 5],
            [1, 3, 5, 2, 4, 6],
            [6, 2, 4, 3, 5, 1],
            [3, 5, 1, 6, 2, 4],
            [4, 6, 2, 5, 1, 3],
            [5, 1, 3, 4, 6, 2]
        ],
        [
            [3, 6, 2, 5, 1, 4],
            [5, 1, 4, 3, 6, 2],
            [2, 3, 6, 1, 4, 5],
            [1, 4, 5, 2, 3, 6],
            [6, 2, 1, 4, 5, 3],
            [4, 5, 3, 6, 2, 1]
        ]
    ];

    const sudokuStateByDoor = {};
    let activeSudokuDoor = null;
    let activeSudokuCellIndex = null;
    let highlightedDigit = null;

    function seededRandom(seed) {
        let s = seed % 2147483647;
        if (s <= 0) s += 2147483646;
        return function () {
            s = (s * 16807) % 2147483647;
            return (s - 1) / 2147483646;
        };
    }

    function createSudokuPuzzleForDoor(doorKey) {
        const keyStr = String(doorKey);
        let seed = 0;
        for (let i = 0; i < keyStr.length; i++) {
            seed = seed * 31 + keyStr.charCodeAt(i);
        }
        const rand = seededRandom(seed + 101);
        const base = baseSudokuSolutions[Math.abs(seed) % baseSudokuSolutions.length];

        // Zahlen 1-6 zufällig permutieren
        const digits = [1, 2, 3, 4, 5, 6];
        for (let i = digits.length - 1; i > 0; i--) {
            const j = Math.floor(rand() * (i + 1));
            [digits[i], digits[j]] = [digits[j], digits[i]];
        }

        const solution = base.map(row => row.map(val => digits[val - 1]));

        // Einfaches Sudoku: ca. 18 von 36 Feldern vorgegeben (pro Zeile mindestens 2 Vorgaben)
        const given = Array.from({ length: 6 }, () => Array(6).fill(false));
        const puzzle = Array.from({ length: 6 }, () => Array(6).fill(0));

        for (let r = 0; r < 6; r++) {
            const cols = [0, 1, 2, 3, 4, 5];
            for (let i = cols.length - 1; i > 0; i--) {
                const j = Math.floor(rand() * (i + 1));
                [cols[i], cols[j]] = [cols[j], cols[i]];
            }
            for (let k = 0; k < 3; k++) {
                const c = cols[k];
                given[r][c] = true;
                puzzle[r][c] = solution[r][c];
            }
        }

        return {
            solution,
            given,
            values: puzzle
        };
    }

    function getOrCreateSudokuState(doorKey) {
        if (!sudokuStateByDoor[doorKey]) {
            sudokuStateByDoor[doorKey] = createSudokuPuzzleForDoor(doorKey);
        }
        return sudokuStateByDoor[doorKey];
    }

    function getConflictingCells(values) {
        const conflicts = new Set();

        for (let i = 0; i < 36; i++) {
            const r = Math.floor(i / 6);
            const c = i % 6;
            const v = values[r][c];
            if (!v) continue;

            // Zeile prüfen
            for (let cc = 0; cc < 6; cc++) {
                if (cc !== c && values[r][cc] === v) {
                    conflicts.add(i);
                    conflicts.add(r * 6 + cc);
                }
            }

            // Spalte prüfen
            for (let rr = 0; rr < 6; rr++) {
                if (rr !== r && values[rr][c] === v) {
                    conflicts.add(i);
                    conflicts.add(rr * 6 + c);
                }
            }

            // 2x3 Block prüfen
            const br = Math.floor(r / 2) * 2;
            const bc = Math.floor(c / 3) * 3;
            for (let rr = br; rr < br + 2; rr++) {
                for (let cc = bc; cc < bc + 3; cc++) {
                    if ((rr !== r || cc !== c) && values[rr][cc] === v) {
                        conflicts.add(i);
                        conflicts.add(rr * 6 + cc);
                    }
                }
            }
        }

        return conflicts;
    }

    function isSudokuSolved(state) {
        for (let r = 0; r < 6; r++) {
            for (let c = 0; c < 6; c++) {
                if (state.values[r][c] !== state.solution[r][c]) {
                    return false;
                }
            }
        }
        return true;
    }

    function renderSudokuBoard(focusIndex = null) {
        if (activeSudokuDoor === null) return;
        const state = getOrCreateSudokuState(activeSudokuDoor);
        const boardEl = document.getElementById('sudoku-board');
        const statusEl = document.getElementById('sudoku-status');
        const conflicts = getConflictingCells(state.values);

        boardEl.innerHTML = '';

        for (let i = 0; i < 36; i++) {
            const r = Math.floor(i / 6);
            const c = i % 6;
            const val = state.values[r][c];
            const isGiven = state.given[r][c];

            const input = document.createElement('input');
            input.type = 'text';
            input.inputMode = 'numeric';
            input.maxLength = 1;
            input.className = 'sudoku-cell';
            if (isGiven) input.classList.add('given');
            if (c === 2) input.classList.add('block-right');
            if (r === 1 || r === 3) input.classList.add('block-bottom');

            if (activeSudokuCellIndex === i) {
                input.classList.add('selected');
            }
            if (highlightedDigit && val === highlightedDigit) {
                input.classList.add('highlighted');
            }
            if (conflicts.has(i)) {
                input.classList.add('conflict');
            }

            input.value = val ? String(val) : '';

            input.addEventListener('focus', () => {
                activeSudokuCellIndex = i;
                const currentVal = state.values[r][c];
                highlightedDigit = currentVal ? currentVal : null
