<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>Lustige Lichtbilder für Lotti</title>
    <style>
        /* Basis-Styling */
        body { 
            margin: 0; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background: #1e1e1e; 
            font-family: -apple-system, sans-serif;
            color: white;
            overflow: hidden;
            perspective: 2000px; 
        }

        /* Hintergrund-Ebene */
        .bg-layer {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: url('../00.jpg');
            background-size: cover;
            background-position: center;
            z-index: -2; 
            transition: filter 1s ease, transform 2s ease, opacity 2s ease; 
            transform: scale(1.1);
            opacity: 0; 
        }

        .bg-loaded {
            opacity: 1;
            transform: scale(1);
        }

        .bg-blurred {
            filter: blur(15px) brightness(0.5);
            transform: scale(1.05); 
        }

        /* LADEANIMATION (HERZ) */
        .heart-loader-wrapper {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 140px; 
            height: 140px;
            z-index: 50;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .heart-loader-wrapper.fade-out {
            opacity: 0;
            transform: translate(-50%, -50%) scale(1.1);
            pointer-events: none;
        }

        .heart-mask {
            position: absolute;
            width: 100%; 
            height: 100%;
            background-color: rgba(255, 255, 255, 0.15);
            -webkit-mask-image: url("data:image/svg+xml;charset=utf-8,%3Csvg viewBox='0 0 24 24' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'/%3E%3C/svg%3E");
            -webkit-mask-size: contain;
            -webkit-mask-repeat: no-repeat;
            -webkit-mask-position: center;
            mask-image: url("data:image/svg+xml;charset=utf-8,%3Csvg viewBox='0 0 24 24' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'/%3E%3C/svg%3E
