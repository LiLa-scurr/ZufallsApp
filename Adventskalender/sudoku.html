<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Sudoku</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            font-family: -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .sudoku-box {
            background: rgba(30, 30, 30, 0.95);
            padding: 22px 18px;
            border-radius: 20px;
            max-width: 94vw;
            width: 430px;
            max-height: 92vh;
            overflow-y: auto;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-sizing: border-box;
        }

        .sudoku-box h2 {
            margin: 0 0 10px 0;
            font-size: 21px;
            color: #feb632;
        }

        .mode-switch {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 14px;
        }

        .mode-btn {
            padding: 8px 18px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.22);
            background: #2c3e50;
            color: #ffffff;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .mode-btn.active {
            background: #feb632;
            color: #1e1e1e;
            border-color: #feb632;
        }

        .sudoku-grid {
            display: grid;
            margin: 0 auto 12px auto;
            border: 2px solid #ffd57e;
            border-radius: 8px;
            overflow: hidden;
            background: #1b222c;
            user-select: none;
        }

        .sudoku-grid.grid-6 {
            grid-template-columns: repeat(6, 1fr);
            width: min(82vw, 312px);
            height: min(82vw, 312px);
        }

        .sudoku-grid.grid-9 {
            grid-template-columns: repeat(9, 1fr);
            width: min(86vw, 360px);
            height: min(86vw, 360px);
        }

        .cell {
            border: 1px solid rgba(255, 255, 255, 0.18);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            cursor: pointer;
            box-sizing: border-box;
            background: transparent;
            color: #ffffff;
            transition: background 0.15s ease;
        }

        .grid-6 .cell {
            font-size: 18px;
        }

        .grid-9 .cell {
            font-size: 15px;
        }

        .cell.given {
            color: #ffd57e;
            background: rgba(255, 213, 126, 0.08);
            cursor: default;
        }

        .cell.selected {
            background: rgba(79, 195, 247, 0.28);
            outline: 2px solid #4fc3f7;
            outline-offset: -2px;
        }

        /* Hebt alle Felder mit derselben Zahl hervor. */
        .cell.same-number {
            background: rgba(255, 193, 7, 0.38);
            color: #fff1bd;
            box-shadow: inset 0 0 0 2px rgba(255, 213, 126, 0.8);
        }

        .cell.error {
            background: rgba(239, 83, 80, 0.32);
            color: #ff8a80;
        }

        /* Block-Trennlinien für 6x6 (2x3 Blöcke) */
        .grid-6 .cell.box-right {
            border-right: 2px solid #ffd57e;
        }

        .grid-6 .cell.box-bottom {
            border-bottom: 2px solid #ffd57e;
        }

        /* Block-Trennlinien für 9x9 (3x3 Blöcke) */
        .grid-9 .cell.box-right {
            border-right: 2px solid #ffd57e;
        }

        .grid-9 .cell.box-bottom {
            border-bottom: 2px solid #ffd57e;
        }

        .numpad {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            margin-bottom: 12px;
        }

        .num-btn {
            min-width: 36px;
            height: 36px;
            padding: 0 10px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: #263238;
            color: #ffffff;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .num-btn:active {
            transform: scale(0.94);
        }

        .status-text {
            min-height: 22px;
            font-size: 14px;
            color: #ffd57e;
            margin-bottom: 12px;
        }

        .actions-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .action-btn {
            background: #2c3e50;
            color: white;
            font-size: 14px;
            padding: 10px 18px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
        }

        .close-btn {
            background: #ffffff;
            color: #1e1e1e;
            font-size: 15px;
            padding: 10px 26px;
            border: none;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <div class="sudoku-box">
        <h2 id="sudoku-title">Sudoku</h2>

        <div class="mode-switch" role="group" aria-label="Länge wählen">
            <button type="button" id="btn-mode-short" class="mode-btn active" onclick="setMode('short')">Kurz (6×6)</button>
            <button type="button" id="btn-mode-long" class="mode-btn" onclick="setMode('long')">Lang (9×9)</button>
        </div>

        <div id="sudoku-grid" class="sudoku-grid grid-6"></div>
        <div id="numpad" class="numpad"></div>
        <div id="status-text" class="status-text">Wähle ein Feld und eine Zahl.</div>

        <div class="actions-row">
            <button type="button" class="action-btn" onclick="checkBoard()">Prüfen</button>
            <button type="button" class="action-btn" onclick="resetCurrentMode()">Neu starten</button>
            <button type="button" class="close-btn" onclick="closeOverlay()">Schließen</button>
        </div>
    </div>

    <script>
        const MODES = {
            short: {
                key: 'short',
                label: 'Kurz',
                size: 6,
                boxRows: 2,
                boxCols: 3,
                removeCount: 16
            },
            long: {
                key: 'long',
                label: 'Lang',
                size: 9,
                boxRows: 3,
                boxCols: 3,
                removeCount: 42
            }
        };

        const params = new URLSearchParams(window.location.search);
        const doorKey = params.get('door') || 'default';
        const STORAGE_KEY = 'lotti_advent_sudoku_v3_' + doorKey;

        if (params.get('door')) {
            document.getElementById('sudoku-title').innerText =
                String(doorKey).startsWith('Test') ? 'Sudoku – ' + doorKey + '-Türchen' : 'Sudoku – Türchen ' + doorKey;
        }

        let currentModeKey = 'short';
        let selectedIndex = null;
        let stateByMode = {};

        function shuffle(arr) {
            const copy = arr.slice();
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        function isValidPlacement(grid, size, boxRows, boxCols, row, col, num) {
            for (let i = 0; i < size; i++) {
                if (grid[row * size + i] === num) return false;
                if (grid[i * size + col] === num) return false;
            }

            const startRow = Math.floor(row / boxRows) * boxRows;
            const startCol = Math.floor(col / boxCols) * boxCols;

            for (let r = startRow; r < startRow + boxRows; r++) {
                for (let c = startCol; c < startCol + boxCols; c++) {
                    if (grid[r * size + c] === num) return false;
                }
            }

            return true;
        }

        function fillGrid(grid, size, boxRows, boxCols, pos = 0) {
            const total = size * size;
            if (pos === total) return true;

            const row = Math.floor(pos / size);
            const col = pos % size;

            if (grid[pos] !== 0) {
                return fillGrid(grid, size, boxRows, boxCols, pos + 1);
            }

            const nums = shuffle(Array.from({ length: size }, (_, idx) => idx + 1));
            for (const num of nums) {
                if (isValidPlacement(grid, size, boxRows, boxCols, row, col, num)) {
                    grid[pos] = num;
                    if (fillGrid(grid, size, boxRows, boxCols, pos + 1)) {
                        return true;
                    }
                    grid[pos] = 0;
                }
            }

            return false;
        }

        function createPuzzle(modeCfg) {
            const total = modeCfg.size * modeCfg.size;
            const solution = new Array(total).fill(0);
            fillGrid(solution, modeCfg.size, modeCfg.boxRows, modeCfg.boxCols);

            const puzzle = solution.slice();
            const indices = shuffle(Array.from({ length: total }, (_, idx) => idx));
            const toRemove = Math.min(modeCfg.removeCount, total - modeCfg.size * 2);

            for (let i = 0; i < toRemove; i++) {
                puzzle[indices[i]] = 0;
            }

            return {
                puzzle: puzzle,
                current: puzzle.slice(),
                solution: solution
            };
        }

        function loadSavedState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return {};
                const parsed = JSON.parse(raw);
                return (parsed && typeof parsed === 'object') ? parsed : {};
            } catch (e) {
                return {};
            }
        }

        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({
                    activeMode: currentModeKey,
                    modes: stateByMode
                }));
            } catch (e) {}
        }

        function ensureModeData(modeKey) {
            const cfg = MODES[modeKey];
            const existing = stateByMode[modeKey];
            const expectedLen = cfg.size * cfg.size;

            if (
                existing &&
                Array.isArray(existing.puzzle) &&
                existing.puzzle.length === expectedLen &&
                Array.isArray(existing.current) &&
                existing.current.length === expectedLen
            ) {
                return existing;
            }

            const generated = createPuzzle(cfg);
            stateByMode[modeKey] = generated;
            saveState();
            return generated;
        }

        function setMode(modeKey) {
            if (!MODES[modeKey]) return;
            currentModeKey = modeKey;
            selectedIndex = null;
            ensureModeData(modeKey);
            saveState();
            updateModeButtons();
            renderNumpad();
            renderGrid();
            document.getElementById('status-text').innerText =
                'Modus „' + MODES[modeKey].label + '“ (' + MODES[modeKey].size + '×' + MODES[modeKey].size + ') aktiv.';
        }

        // Startet dasselbe Sudoku neu (löscht nur eigene Einträge, erstellt kein neues Rätsel)
        function resetCurrentMode() {
            const cfg = MODES[currentModeKey];
            const data = ensureModeData(currentModeKey);
            data.current = data.puzzle.slice();
            selectedIndex = null;
            saveState();
            renderGrid();
            document.getElementById('status-text').innerText =
                cfg.label + '-Sudoku wurde zurückgesetzt.';
        }

        function updateModeButtons() {
            document.getElementById('btn-mode-short').classList.toggle('active', currentModeKey === 'short');
            document.getElementById('btn-mode-long').classList.toggle('active', currentModeKey === 'long');
        }

        function renderNumpad() {
            const cfg = MODES[currentModeKey];
            const pad = document.getElementById('numpad');
            pad.innerHTML = '';

            for (let n = 1; n <= cfg.size; n++) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'num-btn';
                btn.innerText = String(n);
                btn.onclick = () => placeNumber(n);
                pad.appendChild(btn);
            }

            const clearBtn = document.createElement('button');
            clearBtn.type = 'button';
            clearBtn.className = 'num-btn';
            clearBtn.innerText = '⌫';
            clearBtn.onclick = () => placeNumber(0);
            pad.appendChild(clearBtn);
        }

        function renderGrid() {
            const cfg = MODES[currentModeKey];
            const data = ensureModeData(currentModeKey);
            const gridEl = document.getElementById('sudoku-grid');

            // Wert der aktuell ausgewählten Zelle ermitteln.
            const selectedValue = selectedIndex === null ? 0 : data.current[selectedIndex];

            gridEl.className = 'sudoku-grid ' + (cfg.size === 6 ? 'grid-6' : 'grid-9');
            gridEl.innerHTML = '';

            for (let idx = 0; idx < cfg.size * cfg.size; idx++) {
                const row = Math.floor(idx / cfg.size);
                const col = idx % cfg.size;
                const givenVal = data.puzzle[idx];
                const curVal = data.current[idx];

                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.index = String(idx);

                if (givenVal !== 0) {
                    cell.classList.add('given');
                    cell.innerText = String(givenVal);
                } else if (curVal !== 0) {
                    cell.innerText = String(curVal);
                }

                if (idx === selectedIndex) {
                    cell.classList.add('selected');
                }

                // Alle gleichen Zahlen markieren – auch vorgegebene Zahlen.
                if (selectedValue !== 0 && curVal === selectedValue) {
                    cell.classList.add('same-number');
                }

                if ((col + 1) % cfg.boxCols === 0 && col + 1 < cfg.size) {
                    cell.classList.add('box-right');
                }

                if ((row + 1) % cfg.boxRows === 0 && row + 1 < cfg.size) {
                    cell.classList.add('box-bottom');
                }

                cell.onclick = () => {
                    selectedIndex = idx;
                    renderGrid();
                };

                gridEl.appendChild(cell);
            }
        }

        function placeNumber(val) {
            if (selectedIndex === null) {
                document.getElementById('status-text').innerText = 'Bitte zuerst ein Feld antippen.';
                return;
            }

            const data = ensureModeData(currentModeKey);

            if (data.puzzle[selectedIndex] !== 0) {
                document.getElementById('status-text').innerText = 'Vorgegebene Zahlen lassen sich nicht ändern.';
                return;
            }

            data.current[selectedIndex] = val;
            saveState();
            renderGrid();
        }

        function checkBoard() {
            const cfg = MODES[currentModeKey];
            const data = ensureModeData(currentModeKey);
            const cells = document.querySelectorAll('#sudoku-grid .cell');
            cells.forEach(c => c.classList.remove('error'));

            let hasError = false;
            let hasEmpty = false;

            for (let idx = 0; idx < cfg.size * cfg.size; idx++) {
                const val = data.current[idx];

                if (val === 0) {
                    hasEmpty = true;
                    continue;
                }

                const row = Math.floor(idx / cfg.size);
                const col = idx % cfg.size;

                const temp = data.current.slice();
                temp[idx] = 0;

                if (!isValidPlacement(temp, cfg.size, cfg.boxRows, cfg.boxCols, row, col, val)) {
                    hasError = true;
                    if (cells[idx]) cells[idx].classList.add('error');
                }
            }

            const statusEl = document.getElementById('status-text');

            if (hasError) {
                statusEl.innerText = 'Rot markierte Zahlen doppeln sich in Zeile, Spalte oder Block.';
            } else if (hasEmpty) {
                statusEl.innerText = 'Bisher alles fehlerfrei – es sind noch Felder offen.';
            } else {
                statusEl.innerText = 'Geschafft! Das ' + cfg.label + '-Sudoku ist vollständig gelöst.';
            }
        }

        function closeOverlay() {
            saveState();

            if (window.parent && typeof window.parent.closeSudokuOverlay === 'function') {
                window.parent.closeSudokuOverlay();
            } else if (window.parent && typeof window.parent.closeContentOverlay === 'function') {
                window.parent.closeContentOverlay();
            }
        }

        (function init() {
            const saved = loadSavedState();

            if (saved.modes && typeof saved.modes === 'object') {
                stateByMode = saved.modes;
            }

            if (saved.activeMode && MODES[saved.activeMode]) {
                currentModeKey = saved.activeMode;
            }

            ensureModeData(currentModeKey);
            updateModeButtons();
            renderNumpad();
            renderGrid();
        })();
    </script>
</body>
</html>
