<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Sudoku</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            font-family: -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .sudoku-box {
            background: rgba(30, 30, 30, 0.92);
            padding: 22px 18px;
            border-radius: 20px;
            max-width: 92vw;
            width: 370px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .sudoku-box h2 {
            margin: 0 0 8px 0;
            font-size: 22px;
            color: #feb632;
        }

        .sudoku-sub {
            font-size: 13px;
            color: #cccccc;
            margin: 0 0 12px 0;
            line-height: 1.4;
        }

        .sudoku-board {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 3px;
            background: #556b82;
            padding: 4px;
            border-radius: 12px;
            margin: 0 auto 14px auto;
            max-width: 320px;
        }

        .sudoku-cell {
            width: 100%;
            aspect-ratio: 1 / 1;
            border: none;
            border-radius: 6px;
            background: #1f2933;
            color: #ffffff;
            font-size: 20px;
            font-weight: 800;
            text-align: center;
            padding: 0;
            box-sizing: border-box;
            outline: none;
            caret-color: #feb632;
        }

        .sudoku-cell.given {
            background: #2e3b4e;
            color: #f8f9fa;
            cursor: pointer;
        }

        .sudoku-cell:not(.given) {
            color: #7dd3fc;
        }

        .sudoku-cell.block-right { margin-right: 4px; }
        .sudoku-cell.block-bottom { margin-bottom: 4px; }

        .sudoku-cell.selected {
            box-shadow: inset 0 0 0 2px #feb632;
            background: #334155;
        }

        .sudoku-cell.highlighted {
            background: #feb632 !important;
            color: #111827 !important;
        }

        .sudoku-cell.conflict {
            background: #991b1b !important;
            color: #fecaca !important;
        }

        .sudoku-status {
            min-height: 22px;
            font-size: 14px;
            font-weight: 600;
            color: #feb632;
            margin: 0 0 10px 0;
        }

        .sudoku-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .sudoku-actions button {
            background: #ffffff;
            color: #1e1e1e;
            font-size: 14px;
            padding: 10px 20px;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="sudoku-box">
        <h2 id="sudoku-title">Sudoku</h2>
        <p class="sudoku-sub">Zahlen 1–6 pro Zeile, Spalte &amp; 2×3-Block. Tippe auf eine Zahl zum Hervorheben.</p>
        <div id="sudoku-board" class="sudoku-board"></div>
        <p id="sudoku-status" class="sudoku-status"></p>
        <div class="sudoku-actions">
            <button onclick="resetSudoku()" style="background: #334155; color: white;">Neu starten</button>
            <button onclick="closeOverlay()">Schließen</button>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const doorKey = params.get('door') || '1';
        const storageKey = 'lotti_advent_sudoku_v1_' + doorKey;

        document.getElementById('sudoku-title').innerText =
            doorKey === 'Test' ? 'Sudoku – Test-Türchen' : 'Sudoku – Türchen ' + doorKey;

        const baseSolutions = [
            [
                [1, 2, 3, 4, 5, 6],
                [4, 5, 6, 1, 2, 3],
                [2, 3, 1, 5, 6, 4],
                [5, 6, 4, 2, 3, 1],
                [3, 1, 2, 6, 4, 5],
                [6, 4, 5, 3, 1, 2]
            ],
            [
                [2, 4, 6, 1, 3, 5],
                [1, 3, 5, 2, 4, 6],
                [6, 2, 4, 3, 5, 1],
                [3, 5, 1, 6, 2, 4],
                [4, 6, 2, 5, 1, 3],
                [5, 1, 3, 4, 6, 2]
            ]
        ];

        let activeIndex = null;
        let highlightedDigit = null;

        function seededRandom(seed) {
            let s = seed % 2147483647;
            if (s <= 0) s += 2147483646;
            return () => {
                s = (s * 16807) % 2147483647;
                return (s - 1) / 2147483646;
            };
        }

        function createPuzzle() {
            let seed = 0;
            for (let i = 0; i < doorKey.length; i++) seed = seed * 31 + doorKey.charCodeAt(i);
            const rand = seededRandom(seed + 101);
            const base = baseSolutions[Math.abs(seed) % baseSolutions.length];

            const digits = [1, 2, 3, 4, 5, 6];
            for (let i = digits.length - 1; i > 0; i--) {
                const j = Math.floor(rand() * (i + 1));
                [digits[i], digits[j]] = [digits[j], digits[i]];
            }

            const solution = base.map(row => row.map(v => digits[v - 1]));
            const given = Array.from({ length: 6 }, () => Array(6).fill(false));
            const values = Array.from({ length: 6 }, () => Array(6).fill(0));

            for (let r = 0; r < 6; r++) {
                const cols = [0, 1, 2, 3, 4, 5];
                for (let i = cols.length - 1; i > 0; i--) {
                    const j = Math.floor(rand() * (i + 1));
                    [cols[i], cols[j]] = [cols[j], cols[i]];
                }
                for (let k = 0; k < 3; k++) {
                    const c = cols[k];
                    given[r][c] = true;
                    values[r][c] = solution[r][c];
                }
            }
            return { solution, given, values };
        }

        function loadState() {
            try {
                const raw = localStorage.getItem(storageKey);
                if (raw) return JSON.parse(raw);
            } catch (e) {}
            const fresh = createPuzzle();
            saveState(fresh);
            return fresh;
        }

        function saveState(st) {
            try { localStorage.setItem(storageKey, JSON.stringify(st)); } catch (e) {}
        }

        let state = loadState();

        function getConflicts(values) {
            const conflicts = new Set();
            for (let i = 0; i < 36; i++) {
                const r = Math.floor(i / 6), c = i % 6, v = values[r][c];
                if (!v) continue;
                for (let cc = 0; cc < 6; cc++) if (cc !== c && values[r][cc] === v) { conflicts.add(i); conflicts.add(r * 6 + cc); }
                for (let rr = 0; rr < 6; rr++) if (rr !== r && values[rr][c] === v) { conflicts.add(i); conflicts.add(rr * 6 + c); }
                const br = Math.floor(r / 2) * 2, bc = Math.floor(c / 3) * 3;
                for (let rr = br; rr < br + 2; rr++) {
                    for (let cc = bc; cc < bc + 3; cc++) {
                        if ((rr !== r || cc !== c) && values[rr][cc] === v) { conflicts.add(i); conflicts.add(rr * 6 + cc); }
                    }
                }
            }
            return conflicts;
        }

        function isSolved() {
            for (let r = 0; r < 6; r++) for (let c = 0; c < 6; c++) if (state.values[r][c] !== state.solution[r][c]) return false;
            return true;
        }

        function render(focusIndex = null) {
            const board = document.getElementById('sudoku-board');
            const status = document.getElementById('sudoku-status');
            const conflicts = getConflicts(state.values);
            board.innerHTML = '';

            for (let i = 0; i < 36; i++) {
                const r = Math.floor(i / 6), c = i % 6;
                const val = state.values[r][c], isGiven = state.given[r][c];

                const input = document.createElement('input');
                input.type = 'text';
                input.inputMode = 'numeric';
                input.maxLength = 1;
                input.className = 'sudoku-cell';
                if (isGiven) input.classList.add('given');
                if (c === 2) input.classList.add('block-right');
                if (r === 1 || r === 3) input.classList.add('block-bottom');
                if (activeIndex === i) input.classList.add('selected');
                if (highlightedDigit && val === highlightedDigit) input.classList.add('highlighted');
                if (conflicts.has(i)) input.classList.add('conflict');
                input.value = val ? String(val) : '';

                input.addEventListener('click', () => {
                    activeIndex = i;
                    const cur = state.values[r][c];
                    highlightedDigit = cur ? (highlightedDigit === cur ? null : cur) : null;
                    render(isGiven ? null : i);
                });

                input.addEventListener('beforeinput', (e) => {
                    if (isGiven || (e.data && !/^[1-6]$/.test(e.data))) e.preventDefault();
                });

                input.addEventListener('input', () => {
                    if (isGiven) { input.value = val ? String(val) : ''; return; }
                    const raw = input.value.replace(/[^1-6]/g, '');
                    const digit = raw ? parseInt(raw.slice(-1), 10) : 0;
                    state.values[r][c] = digit;
                    activeIndex = i;
                    highlightedDigit = digit || null;
                    saveState(state);
                    render(i);
                });

                input.addEventListener('keydown', (e) => {
                    if (!isGiven && (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0')) {
                        e.preventDefault();
                        state.values[r][c] = 0;
                        highlightedDigit = null;
                        saveState(state);
                        render(i);
                    }
                });

                board.appendChild(input);
            }

            if (isSolved()) status.innerText = 'Super gemacht! Das Sudoku ist gelöst!';
            else if (conflicts.size > 0) status.innerText = 'Rot markierte Zahlen doppeln sich.';
            else if (highlightedDigit) status.innerText = 'Alle ' + highlightedDigit + 'en sind hervorgehoben.';
            else status.innerText = '';

            if (focusIndex !== null && board.children[focusIndex]) {
                const target = board.children[focusIndex];
                target.focus({ preventScroll: true });
                if (target.setSelectionRange && target.value) target.setSelectionRange(1, 1);
            }
        }

        function resetSudoku() {
            state = createPuzzle();
            saveState(state);
            activeIndex = null;
            highlightedDigit = null;
            render();
        }

        function closeOverlay() {
            if (window.parent && typeof window.parent.closeSudokuOverlay === 'function') {
                window.parent.closeSudokuOverlay();
            }
        }

        render();
    </script>
</body>
</html>
