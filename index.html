<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Meine Gute-Laune-App</title>
    <style>
        /* Basis-Styling */
        body { 
            margin: 0; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background: #1e1e1e; 
            font-family: -apple-system, sans-serif;
            color: white;
            overflow: hidden;
            perspective: 1000px; /* Ermöglicht krasse 3D-Effekte */
        }

        /* Container für die einzelnen "Seiten" */
        .view {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        /* NEU: Hintergrundbild NUR für die Startseite (00.jpg) */
        #view-menu {
            /* Das linear-gradient legt einen leichten Dunkelschleier über dein Bild, damit man die Schrift perfekt lesen kann */
            background-image: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.6)), url('00.jpg');
            background-size: cover;
            background-position: center;
        }

        /* Versteckt die inaktiven Seiten */
        .hidden { 
            display: none !important; 
        }

        h1 {
            font-size: 28px;
            margin-bottom: 30px;
            text-shadow: 0 3px 6px rgba(0,0,0,0.5);
        }

        /* Das Bild-Styling - optimiert gegen Abschneiden */
        img { 
            max-width: 90%; 
            max-height: 60vh; 
            border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            object-fit: contain;
            backface-visibility: hidden; /* Verhindert Flackern bei 3D-Drehungen */
        }

        /* Der Extra-Text Bereich */
        .text-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 16px;
            max-width: 85%;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            font-size: 18px;
            line-height: 1.5;
            backdrop-filter: blur(10px);
        }

        /* Allgemeines Button-Styling */
        button { 
            margin-top: 15px;
            padding: 16px 35px; 
            font-size: 18px; 
            border-radius: 30px; 
            border: none; 
            background: #007aff; 
            color: white; 
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,122,255,0.3);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.95); }

        /* Besondere Buttons */
        .btn-secondary { background: #34c759; box-shadow: 0 4px 10px rgba(52,199,89,0.3); } 
        .btn-back { background: #545456; font-size: 14px; padding: 10px 20px; margin-top: 30px; } 

        /* DER GALAXY / GEMINI REGENBOGEN BUTTON */
        .btn-rainbow {
            position: relative;
            background: #007aff; 
            z-index: 1; 
            margin-top: 25px;
        }

        .btn-rainbow::before {
            content: '';
            position: absolute;
            top: -4px; left: -4px; right: -4px; bottom: -4px;
            z-index: -1; 
            border-radius: 34px; 
            background: linear-gradient(90deg, #ff007f, #7f00ff, #007aff, #00ff7f, #fff000, #ff007f);
            background-size: 400% 400%;
            filter: blur(8px);
            opacity: 0.85;
            animation: rainbowMovement 5s linear infinite;
        }

        @keyframes rainbowMovement {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }


        /* ==========================================
           NEU: KRASSE 2000er POWERPOINT ANIMATIONEN
           ========================================== */
        
        /* 1. Der Hyper-Wirbel (Extremes Drehen und Skalieren) */
        .pt-wirbel { animation: pptWirbel 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes pptWirbel { 
            from { transform: rotate(-720deg) scale(0); opacity: 0; } 
            to { transform: rotate(0deg) scale(1); opacity: 1; } 
        }

        /* 2. Der 3D-Trommel-Flip (Bild klappt aus dem Raum nach vorne) */
        .pt-flip { animation: pptFlip 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; }
        @keyframes pptFlip { 
            from { transform: rotateX(-90deg); opacity: 0; } 
            to { transform: rotateX(0deg); opacity: 1; } 
        }

        /* 3. Der Gummiband-Pop (Federt extrem ein und aus) */
        .pt-bounce { animation: pptBounce 0.65s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards; }
        @keyframes pptBounce { 
            0% { transform: scale(0.1); opacity: 0; } 
            70% { transform: scale(1.08); } 
            100% { transform: scale(1); opacity: 1; } 
        }

        /* 4. Das Epic-Einfliegen (Kommt mit Neigung von links reingeschossen) */
        .pt-epic-slide { animation: pptEpicSlide 0.55s cubic-bezier(0.1, 0.8, 0.3, 1) forwards; }
        @keyframes pptEpicSlide { 
            from { transform: translateX(-100vw) rotate(-20deg) scale(0.5); opacity: 0; } 
            to { transform: translateX(0) rotate(0deg) scale(1); opacity: 1; } 
        }

    </style>
</head>
<body>

    <div id="view-menu" class="view">
        <h1>✨ Gute-Laune-Zentrale ✨</h1>
        <button onclick="switchView('gallery')">Zu den Bildern</button>
        <button onclick="switchView('text')" class="btn-secondary">Extra-Text lesen</button>
    </div>

    <div id="view-gallery" class="view hidden">
        <img id="display" src="" alt="Zufallsbild">
        <button onclick="showRandom()" class="btn-rainbow">Gute-Laune-Knopf</button>
        <button onclick="switchView('menu')" class="btn-back">⬅ Zurück zum Menü</button>
    </div>

    <div id="view-text" class="view hidden">
        <h1>💡 Ein kleiner Gedanke</h1>
        <div class="text-box">
            <p>Hier ist dein ganz persönlicher Extra-Text! ☀️</p>
            <p>Egal wie stressig der Tag gerade ist: Atme einmal tief durch, lass die Schultern locker und schenk dir selbst ein Lächeln. Du machst das großartig und bist genau richtig, so wie du bist!</p>
        </div>
        <button onclick="switchView('menu')" class="btn-back">⬅ Zurück zum Menü</button>
    </div>

<script>
    const images = [];
    for (let i = 1; i <= 51; i++) {
        if (i < 10) {
            images.push('0' + i + '.jpg'); 
        } else {
            images.push(i + '.jpg');  
        }
    }

    // Die neuen, krassen Animationen im JavaScript hinterlegen
    const transitions = ['pt-wirbel', 'pt-flip', 'pt-bounce', 'pt-epic-slide'];

    function switchView(viewId) {
        document.getElementById('view-menu').classList.add('hidden');
        document.getElementById('view-gallery').classList.add('hidden');
        document.getElementById('view-text').classList.add('hidden');

        document.getElementById('view-' + viewId).classList.remove('hidden');

        if (viewId === 'gallery') {
            showRandom();
        }
    }

    function showRandom() {
        if (images.length === 0) return;

        const randomIndex = Math.floor(Math.random() * images.length);
        const chosenImage = images[randomIndex];
        const imgElement = document.getElementById('display');
        
        // Verhindert das "Hacken": Wir nehmen die CSS-Klasse erst weg
        imgElement.className = "";
        
        const randomEffect = transitions[Math.floor(Math.random() * transitions.length)];
        
        // Wir warten 30 Millisekunden (wichtig für iOS Safari!), damit das alte Bild 
        // komplett ausgeblendet ist, bevor der neue krasse Effekt abfeuert.
        setTimeout(() => {
            imgElement.src = chosenImage;
            imgElement.classList.add(randomEffect);
        }, 30);
    }
</script>
</body>
</html>
