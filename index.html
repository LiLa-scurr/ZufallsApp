<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Lustige Lichtbilder für Lotti</title>
    <style>
        /* Basis-Styling */
        body { 
            margin: 0; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background: #1e1e1e; 
            font-family: -apple-system, sans-serif;
            color: white;
            overflow: hidden;
            perspective: 1000px; 
        }

        /* NEU: Die eigene Hintergrund-Ebene für 00.jpg */
        .bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.6)), url('00.jpg');
            background-size: cover;
            background-position: center;
            z-index: -2; /* Ganz nach hinten */
            transition: filter 0.6s ease, transform 0.6s ease; /* Schöner, geschmeidiger Übergang */
            transform: scale(1);
        }

        /* Klasse für den Weichzeichner (wird per JS aktiviert) */
        .bg-blurred {
            filter: blur(15px);
            transform: scale(1.08); /* Verhindert weiße Ränder beim Bluren */
        }

        /* Container für die einzelnen "Seiten" */
        .view {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        /* Versteckt die inaktiven Seiten */
        .hidden { 
            display: none !important; 
        }

        /* Der neue mehrzeilige Titel */
        h1 {
            font-size: 28px;
            line-height: 1.4;
            margin-bottom: 35px;
            text-shadow: 0 3px 8px rgba(0,0,0,0.6);
            font-weight: 800;
        }

        /* Das Bild-Styling */
        img { 
            max-width: 90%; 
            max-height: 60vh; 
            border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            object-fit: contain;
            backface-visibility: hidden; 
        }

        /* Der Extra-Text Bereich */
        .text-box {
            background: rgba(0, 0, 0, 0.4); /* Etwas dunkler für bessere Lesbarkeit auf dem Hintergrund */
            padding: 25px;
            border-radius: 16px;
            max-width: 85%;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            font-size: 18px;
            line-height: 1.5;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        /* Allgemeines Button-Styling */
        button { 
            margin-top: 15px;
            padding: 16px 35px; 
            font-size: 18px; 
            border-radius: 30px; 
            border: none; 
            background: #007aff; 
            color: white; 
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,122,255,0.3);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.95); }

        .btn-secondary { background: #34c759; box-shadow: 0 4px 10px rgba(52,199,89,0.3); } 
        .btn-back { background: #545456; font-size: 14px; padding: 10px 20px; margin-top: 30px; } 

        /* DER GALAXY / GEMINI REGENBOGEN BUTTON */
        .btn-rainbow {
            position: relative;
            background: #007aff; 
            z-index: 1; 
            margin-top: 25px;
        }

        .btn-rainbow::before {
            content: '';
            position: absolute;
            top: -4px; left: -4px; right: -4px; bottom: -4px;
            z-index: -1; 
            border-radius: 34px; 
            background: linear-gradient(90deg, #ff007f, #7f00ff, #007aff, #00ff7f, #fff000, #ff007f);
            background-size: 400% 400%;
            filter: blur(8px);
            opacity: 0.85;
            animation: rainbowMovement 5s linear infinite;
        }

        @keyframes rainbowMovement {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
