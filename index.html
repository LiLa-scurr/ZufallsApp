<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Meine Gute-Laune-App</title>
    <style>
        /* Basis-Styling */
        body { 
            margin: 0; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background: #1e1e1e; 
            font-family: -apple-system, sans-serif;
            color: white;
            overflow: hidden;
        }

        /* Container für die einzelnen "Seiten" */
        .view {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        /* Versteckt die inaktiven Seiten */
        .hidden { 
            display: none !important; 
        }

        h1 {
            font-size: 28px;
            margin-bottom: 30px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        /* Das Bild-Styling */
        img { 
            max-width: 90%; 
            max-height: 60vh; 
            border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            object-fit: contain;
        }

        /* Der Extra-Text Bereich */
        .text-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 16px;
            max-width: 85%;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            font-size: 18px;
            line-height: 1.5;
        }

        /* Button-Styling */
        button { 
            margin-top: 15px;
            padding: 16px 35px; 
            font-size: 18px; 
            border-radius: 30px; 
            border: none; 
            background: #007aff; 
            color: white; 
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,122,255,0.3);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.95); }

        /* Besondere Buttons */
        .btn-secondary { background: #34c759; box-shadow: 0 4px 10px rgba(52,199,89,0.3); } /* Grün */
        .btn-back { background: #545456; font-size: 14px; padding: 10px 20px; margin-top: 30px; } /* Grau */

        /* ==========================================
           FANCY 2000er POWERPOINT TRANSITIONS (CSS)
           ========================================== */
        
        /* 1. Verblassen (Fade) */
        .pt-fade { animation: pptFade 0.6s ease-out; }
        @keyframes pptFade { from { opacity: 0; } to { opacity: 1; } }

        /* 2. Einfliegen von unten (Slide Up) */
        .pt-slide { animation: pptSlide 0.5s cubic-bezier(0.1, 0.8, 0.3, 1); }
        @keyframes pptSlide { from { transform: translateY(100vh); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* 3. Reizoomen (Zoom In) */
        .pt-zoom { animation: pptZoom 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes pptZoom { from { transform: scale(0.1); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* 4. Der legendäre Wirbel (Spin & Zoom) */
        .pt-wirbel { animation: pptWirbel 0.7s ease-out; }
        @keyframes pptWirbel { from { transform: rotate(-360deg) scale(0.1); opacity: 0; } to { transform: rotate(0deg) scale(1); opacity: 1; } }

    </style>
</head>
<body>

    <div id="view-menu" class="view">
        <h1>✨ Gute-Laune-Zentrale ✨</h1>
        <button onclick="switchView('gallery')">Zu den Bildern</button>
        <button onclick="switchView('text')" class="btn-secondary">Extra-Text lesen</button>
    </div>

    <div id="view-gallery" class="view hidden">
        <img id="display" src="" alt="Zufallsbild">
        <button onclick="showRandom()">Gute-Laune-Knopf</button>
        <button onclick="switchView('menu')" class="btn-back">⬅ Zurück zum Menü</button>
    </div>

    <div id="view-text" class="view hidden">
        <h1>💡 Ein kleiner Gedanke</h1>
        <div class="text-box">
            <p>Hier ist dein ganz persönlicher Extra-Text! ☀️</p>
            <p>Egal wie stressig der Tag gerade ist: Atme einmal tief durch, lass die Schultern locker und schenk dir selbst ein Lächeln. Du machst das großartig und bist genau richtig, so wie du bist!</p>
        </div>
        <button onclick="switchView('menu')" class="btn-back">⬅ Zurück zum Menü</button>
    </div>

<script>
    // 1. Bilder-Liste befüllen (wie gewohnt)
    const images = [];
    for (let i = 1; i <= 51; i++) {
        if (i < 10) {
            images.push('0' + i + '.jpg'); 
        } else {
            images.push(i + '.jpg');  
        }
    }

    // Liste aller verfügbaren PowerPoint-Effekte
    const transitions = ['pt-fade', 'pt-slide', 'pt-zoom', 'pt-wirbel'];

    // 2. Funktion zum Wechseln der Menü-Seiten
    function switchView(viewId) {
        // Zuerst alle Seiten verstecken
        document.getElementById('view-menu').classList.add('hidden');
        document.getElementById('view-gallery').classList.add('hidden');
        document.getElementById('view-text').classList.add('hidden');

        // Nur die gewünschte Seite anzeigen
        document.getElementById('view-' + viewId).classList.remove('hidden');

        // Wenn zur Galerie gewechselt wird, direkt ein erstes Bild laden
        if (viewId === 'gallery') {
            showRandom();
        }
    }

    // 3. Funktion für den "Gute-Laune-Knopf" (mit zufälligem Effekt)
    function showRandom() {
        if (images.length === 0) return;

        const randomIndex = Math.floor(Math.random() * images.length);
        const chosenImage = images[randomIndex];
        const imgElement = document.getElementById('display');
        
        // Altes Bild kurz leeren, damit der Effekt sauber neu startet
        imgElement.src = "";
        
        // Alle alten Animations-Klassen entfernen
        imgElement.className = "";
        
        // Zufälligen PowerPoint-Effekt auswählen
        const randomEffect = transitions[Math.floor(Math.random() * transitions.length)];
        
        // Trick: Einen winzigen Moment warten, bevor das neue Bild geladen wird.
        // Das zwingt das iPhone, die Animation jedes Mal komplett neu abzufeuern.
        setTimeout(() => {
            imgElement.src = chosenImage;
            imgElement.classList.add(randomEffect);
        }, 10);
    }
</script>
</body>
</html>
